name: Enhance AI LAB screenshots

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/enhance-ai-lab-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current website
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Enhance six screenshot assets
        shell: bash
        run: |
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          from pathlib import Path

          paths = [
              "assets/first-payment.png",
              "assets/earnings.png",
              "assets/career.png",
              "assets/jobs.png",
              "assets/lessons.png",
              "assets/practice.png",
          ]
          for name in paths:
              path = Path(name)
              if not path.is_file():
                  raise FileNotFoundError(name)
              with Image.open(path) as original:
                  image = original.convert("RGB")
              original_size = image.size
              image = image.resize(
                  (image.width * 3, image.height * 3),
                  resample=Image.Resampling.LANCZOS
              )
              image = ImageEnhance.Sharpness(image).enhance(1.35)
              image = ImageEnhance.Contrast(image).enhance(1.03)
              image = image.filter(ImageFilter.UnsharpMask(
                  radius=1.3, percent=160, threshold=2
              ))
              image.save(path, format="PNG", optimize=True)
              print(f"{name}: {original_size} -> {image.size}")
          PY

      - name: Commit improved screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/first-payment.png assets/earnings.png assets/career.png assets/jobs.png assets/lessons.png assets/practice.png
          if ! git diff --cached --quiet; then
            git commit -m "Sharpen AI LAB screenshots at 3x resolution"
            git push
          else
            echo "Screenshot assets already up to date"
          fi
